version: '3.8'
services:
  app:
    build: .
    volumes:
      - ..:/workspace
    depends_on:
      - mysql
      - redis
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: crietto
      MYSQL_USER: crietto
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
  redis:
    image: redis:7
    ports:
      - "6379:6379"
